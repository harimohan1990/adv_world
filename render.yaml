services:
  - type: web
    name: advantage-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advantage-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "https://advantage-frontend.vercel.app" # Placeholder to be updated later

databases:
  - name: advantage-db
    plan: free
    region: oregon
    postgresMajorVersion: 15
