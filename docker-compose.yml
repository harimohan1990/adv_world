version: "3.8"
services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_adv
    ports:
      - "5450:5432"

  redis:
    image: redis:7
    ports:
      - "16379:6379"

volumes:
  postgres_data:
